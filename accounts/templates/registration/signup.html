{% extends "base.html" %}

{%block title%} {{ block.super }} | Registrazione{%endblock title%}
{%block content%}
    <h2>Registrazione</h2>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Registrati</button>
    </form>

    <p>Hai già un account?
        <a href="{% url 'login' %}">login</a>
    </p>
{%endblock content%}
